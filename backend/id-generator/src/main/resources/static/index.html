<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Templated ID Generation</title>

    <link rel="stylesheet" href="/styles.css">
</head>

<body>

<div class="container">

    <h1>Templated ID Generation</h1>

    <div class="card">

        <label for="template">
            Template
        </label>

        <select id="template"></select>

        <label for="city">
            City
        </label>

        <select id="city"></select>

        <label for="count">
            Count
        </label>

        <input
            id="count"
            type="number"
            min="1"
            max="1000"
            value="1"
        >

        <button id="issueButton">
            Issue IDs
        </button>

    </div>

    <div class="card">

        <h2>Issued IDs</h2>

        <div id="error"></div>

        <ul id="results"></ul>

    </div>

    <div class="card">

        <h2>Recently Issued</h2>

        <ul id="recent"></ul>

    </div>

</div>

<script src="/app.js"></script>

</body>
</html>
